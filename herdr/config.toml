# herdr — https://herdr.dev/docs/
# Symlinked to ~/.config/herdr/config.toml by bin/install.
#
# Only non-default values belong here. Everything else, annotated:
#   herdr --default-config
# Reload without restarting: herdr server reload-config  (or prefix+shift+r)

onboarding = false

[theme]
auto_switch = true
dark_name = "rose-pine"
light_name = "rose-pine-dawn"

[keys]
prefix = "ctrl+a"
copy_mode = "prefix+["

next_tab = ["prefix+n", "prefix+ctrl+n"]
previous_tab = ["prefix+p", "prefix+ctrl+p"]

split_vertical = ["prefix+v", "prefix+%"]
split_horizontal = ["prefix+minus", 'prefix+"']

[[keys.command]]
key = "prefix+<"
type = "shell"
command = "herdr pane resize --pane \"$HERDR_ACTIVE_PANE_ID\" --direction left --amount 0.04"

[[keys.command]]
key = "prefix+>"
type = "shell"
command = "herdr pane resize --pane \"$HERDR_ACTIVE_PANE_ID\" --direction right --amount 0.04"

[ui]
show_agent_labels_on_pane_borders = true
prompt_new_tab_name = false

agent_panel_sort = "spaces"
[ui.toast]
delivery = "system"

# Remote herdr state, polled into workspace metadata by herdr/remote-status.
# The first two rows are herdr's defaults; $mini is the bridged token.
[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"], ["$mini"]]
